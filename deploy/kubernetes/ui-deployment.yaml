apiVersion: apps/v1
kind: Deployment
metadata:
  name: legal-qa-platform-ui
  labels:
    app.kubernetes.io/name: legal-qa-platform
    app.kubernetes.io/component: ui
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: legal-qa-platform
      app.kubernetes.io/component: ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: legal-qa-platform
        app.kubernetes.io/component: ui
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ui
          image: <IMAGE_REFERENCE>
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "streamlit", "run"]
          args:
            - /app/src/legal_qa_platform/ui/streamlit_app.py
            - --server.address=0.0.0.0
            - --server.port=8501
            - --server.headless=true
            - --server.fileWatcherType=none
            - --browser.gatherUsageStats=false
            - --
            - --api-base-url
            - http://legal-qa-platform-api
          ports:
            - name: http
              containerPort: 8501
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: home
              mountPath: /home/appuser
      volumes:
        - name: tmp
          emptyDir: {}
        - name: home
          emptyDir: {}

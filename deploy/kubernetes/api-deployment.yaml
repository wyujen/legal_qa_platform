apiVersion: apps/v1
kind: Deployment
metadata:
  name: legal-qa-platform-api
  labels:
    app.kubernetes.io/name: legal-qa-platform
    app.kubernetes.io/component: api
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: legal-qa-platform
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: legal-qa-platform
        app.kubernetes.io/component: api
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: <IMAGE_REFERENCE>
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: legal-qa-platform-config
          env:
            - name: POSTGRES_LITELLM_USER
              valueFrom:
                secretKeyRef:
                  name: <RUNTIME_SECRET_NAME>
                  key: <POSTGRES_LITELLM_USER_KEY>
            - name: POSTGRES_LITELLM_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: <RUNTIME_SECRET_NAME>
                  key: <POSTGRES_LITELLM_PASSWORD_KEY>
            - name: POSTGRES_LITELLM_DATABASE
              valueFrom:
                secretKeyRef:
                  name: <RUNTIME_SECRET_NAME>
                  key: <POSTGRES_LITELLM_DATABASE_KEY>
            - name: QDRANT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: <RUNTIME_SECRET_NAME>
                  key: <QDRANT_API_KEY_KEY>
            - name: LITELLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: <RUNTIME_SECRET_NAME>
                  key: <LITELLM_API_KEY_KEY>
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}

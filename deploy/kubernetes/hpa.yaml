apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: legal-qa-platform-api
  labels:
    app.kubernetes.io/name: legal-qa-platform
    app.kubernetes.io/component: api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: legal-qa-platform-api
  minReplicas: 2
  maxReplicas: 10
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
    scaleUp:
      stabilizationWindowSeconds: 60
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

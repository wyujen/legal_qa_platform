apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: legal-qa-platform
  labels:
    app.kubernetes.io/name: legal-qa-platform
spec:
  ingressClassName: <INGRESS_CLASS_NAME>
  tls:
    - hosts:
        - <INGRESS_HOST>
      secretName: <TLS_SECRET_REFERENCE>
  rules:
    - host: <INGRESS_HOST>
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: legal-qa-platform-api
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: legal-qa-platform-ui
                port:
                  name: http
